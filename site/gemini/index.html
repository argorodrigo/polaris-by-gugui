<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>polaris by Gugui</title>
<meta name="description" content="polaris by Gugui keeps everything your AI chats decide in one place: one record per topic, an Inbox, and what is waiting on you.">
<meta name="theme-color" content="#07051a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="polaris">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{
  --bg:#07051a; --bg2:#0e0a2b; --ink:#efeaff; --dim:#a79fd0; --faint:#6f679c;
  --v1:#b9a8ff; --v2:#8a74ff; --v3:#5a3fd8; --v4:#2c1a7a; --teal:#7fe3e0; --bronze:#b08a57; --bronze2:#e2c08c;
  --glass:rgba(160,140,255,.08); --glass2:rgba(160,140,255,.14); --line:rgba(185,168,255,.18); --line2:rgba(185,168,255,.32);
  --ok:#8ff0c0; --warn:#ffd38a; --bad:#ff9db4;
  --r:18px; --r2:12px; --nav:64px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
@media(min-width:900px){body{padding-bottom:0;padding-left:220px}}
#stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1200px 700px at 80% -10%,rgba(138,116,255,.22),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(127,227,224,.08),transparent 60%),var(--bg)}
a{color:var(--v1)} a:hover{color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2;font-weight:800;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px}
p{margin:.3em 0 .8em}
.dim{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:13px}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
/* lockup */
.lockup{display:inline-flex;align-items:baseline;gap:.35em;text-decoration:none;white-space:nowrap}
.lockup .word{position:relative;font-weight:900;font-size:26px;letter-spacing:-.02em;filter:drop-shadow(0 2px 6px rgba(138,116,255,.45))}
.lockup .g{background:linear-gradient(180deg,#f3efff 0%,#c3b4ff 38%,#8a74ff 70%,#5a3fd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lockup .by{font-size:12px;color:var(--dim);font-weight:600}
.lockup .by b{color:var(--ink);font-weight:800}
.lockup.img img{display:block;height:38px;width:auto}
@media(min-width:900px){#side .lockup.img img{height:46px}}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:stretch;
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(10,7,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--dim);text-decoration:none;position:relative}
#nav a svg{width:22px;height:22px}
#nav a.on{color:#fff} #nav a.on::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--v1)}
#nav .cap{color:#fff} #nav .cap span.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin-top:-14px;
  background:radial-gradient(circle at 35% 30%,#d9ceff,#8a74ff 55%,#4a2fc0);box-shadow:0 6px 18px rgba(138,116,255,.5),inset 0 1px 0 rgba(255,255,255,.6)}
#side{display:none}
@media(min-width:900px){
  #nav{display:none}
  #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:220px;padding:22px 14px;gap:4px;border-right:1px solid var(--line);background:rgba(10,7,32,.6);backdrop-filter:blur(14px)}
  #side .lockup{margin:0 8px 18px}
  #side a.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--dim);text-decoration:none}
  #side a.item svg{width:18px;height:18px}
  #side a.item.on,#side a.item:hover{background:var(--glass2);color:#fff}
  #side .badge{margin-left:auto}
  #side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 12px}
}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--v3);color:#fff;font-size:11px;font-weight:800}
#nav .badge{position:absolute;top:6px;left:calc(50% + 6px);height:16px;min-width:16px;font-size:10px}
/* top bar on phone */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;max-width:980px;margin:0 auto}
@media(min-width:900px){.top{display:none}}
/* cards */
.card{background:linear-gradient(180deg,rgba(185,168,255,.10),rgba(185,168,255,.04));border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.25)}
.card + .card{margin-top:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stat{text-decoration:none;color:inherit;display:block}
.stat b{display:block;font-size:28px;font-weight:900;color:#fff}
.stat span{color:var(--dim);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--glass2);border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;min-height:38px}
.btn:hover{background:rgba(185,168,255,.24)}
.btn.primary{border:0;color:#140a3a;background:linear-gradient(180deg,#efe9ff,#b9a8ff 55%,#8a74ff);box-shadow:0 6px 20px rgba(138,116,255,.35),inset 0 1px 0 #fff}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,157,180,.4);color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:6px;border-radius:8px}
.icon-btn:hover{color:#fff;background:var(--glass2)}
/* forms */
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{width:100%;background:rgba(5,3,20,.55);border:1px solid var(--line2);border-radius:var(--r2);padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--v1);box-shadow:0 0 0 3px rgba(185,168,255,.18)}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;color:var(--ink);font-size:14px;margin:0;font-weight:500}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--v2)}
/* lists */
.list{list-style:none;margin:0;padding:0}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--faint);margin-top:3px}
.item .actions{display:flex;gap:4px;flex-wrap:wrap}
.sup{text-decoration:line-through;color:var(--faint)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--glass2);color:var(--v1);text-transform:uppercase;letter-spacing:.04em}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.lock{color:var(--bronze2)}
.words{font-style:italic;color:var(--ink);border-left:2px solid var(--v2);padding-left:8px;margin:4px 0}
.seg{display:inline-flex;background:rgba(5,3,20,.5);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;color:var(--dim);cursor:pointer;font-weight:700;font-size:13px}
.seg button.on{background:var(--v3);color:#fff}
.empty{text-align:center;padding:26px 10px;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid var(--v1);flex:none;margin-top:6px}
.dot.partly{background:linear-gradient(90deg,var(--v1) 50%,transparent 50%)} .dot.harvested{background:var(--v1)}
pre.code{white-space:pre-wrap;background:rgba(5,3,20,.6);border:1px solid var(--line);border-radius:var(--r2);padding:12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:340px;overflow:auto}
/* hero */
.intro{margin:6px 0 0;max-width:420px}
.intro h1{font-size:26px}
.hero{position:relative;margin:0 -16px 8px;display:flex;justify-content:center;overflow:visible;padding:4px 0 10px}
.orb{position:relative;width:min(calc(100vw - 40px),600px);aspect-ratio:1;margin:-9% 0 -11%}
.orb .back,.orb .front{position:absolute;inset:0;pointer-events:none}
.orb .front{z-index:2}
.orb svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hero .planet{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:1;
  background:
   radial-gradient(circle at 32% 26%,rgba(255,255,255,.85) 0,rgba(255,255,255,.2) 9%,transparent 20%),
   radial-gradient(circle at 62% 70%,rgba(127,227,224,.35),transparent 38%),
   radial-gradient(circle at 24% 64%,rgba(90,63,216,.55),transparent 30%),
   radial-gradient(circle at 70% 30%,rgba(205,192,255,.5),transparent 34%),
   radial-gradient(circle at 45% 45%,#b7a6ff 0,#7c62f0 45%,#3a2398 78%,#1a0e52 100%);
  box-shadow:inset -22px -26px 60px rgba(10,4,40,.75),inset 10px 12px 30px rgba(255,255,255,.18),0 0 80px rgba(138,116,255,.45),0 0 180px rgba(138,116,255,.18)}
.hero .planet::after{content:"";position:absolute;inset:0;border-radius:50%;background:
  radial-gradient(circle at 70% 58%,rgba(20,10,70,.35) 0 6%,transparent 7%),radial-gradient(circle at 38% 72%,rgba(20,10,70,.28) 0 4%,transparent 5%),
  radial-gradient(circle at 56% 34%,rgba(20,10,70,.22) 0 3%,transparent 4%);mix-blend-mode:multiply}
.hero .planet.art{background:center/cover no-repeat var(--art);border-radius:50%;width:44%;aspect-ratio:1;box-shadow:0 0 60px rgba(138,116,255,.38),0 0 150px rgba(138,116,255,.14);animation:none!important}
.hero .planet.art::after{display:none}
.hero .station{position:absolute;z-index:3;width:14px;height:14px;transform:translate(-50%,-50%);text-decoration:none;color:var(--ink)}
.hero .station i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9a8ff 50%,#5a3fd8);box-shadow:0 0 12px rgba(185,168,255,.9);transition:transform .2s}
.hero .station .lbl{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.hero .station small{font-size:10px;color:var(--dim);letter-spacing:0;text-transform:none;font-weight:700}
.hero .station:hover i,.hero .station:focus-visible i{transform:scale(1.35)}
.hero .station::after{content:"";position:absolute;inset:-12px}
.resident{position:relative;aspect-ratio:400/1276}
.resident i{position:absolute;inset:0;background:center bottom/contain no-repeat var(--res)}
.resident i.h,.resident i.c{opacity:0}
@media(prefers-reduced-motion:no-preference){
  .resident.blinks i:first-child{animation:bOpen 5.2s steps(1) infinite}
  .resident.blinks i.h{animation:bHalf 5.2s steps(1) infinite}
  .resident.blinks i.c{animation:bClosed 5.2s steps(1) infinite}
}
@keyframes bOpen{0%,93.9%{opacity:1}94%,97.9%{opacity:0}98%{opacity:1}}
@keyframes bHalf{0%,93.9%{opacity:0}94%,94.9%{opacity:1}95%,96.9%{opacity:0}97%,97.9%{opacity:1}98%{opacity:0}}
@keyframes bClosed{0%,94.9%{opacity:0}95%,96.9%{opacity:1}97%{opacity:0}}
.hero .resident.desk{position:absolute;right:calc(50% + 305px);bottom:6px;width:74px;z-index:4;display:none}
.intro .resident.mob{float:left;width:46px;margin:-6px 14px 0 0}
@media(min-width:760px){.hero .resident.desk{display:block}.intro .resident.mob{display:none}}
.lockup .word .i{position:relative;display:inline-block}
.lockup .tri{position:absolute;width:.4em;height:.46em;left:50%;top:.05em;transform:translateX(-50%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
@media(min-width:900px){.grid.stats{grid-template-columns:repeat(6,1fr)}}
@media(prefers-reduced-motion:no-preference){
  .hero .planet{animation:breathe 9s ease-in-out infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dashflow{to{stroke-dashoffset:-24}}
@media(prefers-reduced-motion:no-preference){.orb .dashes{animation:dashflow 6s linear infinite}}
@keyframes breathe{50%{box-shadow:inset -22px -26px 60px rgba(10,4,40,.75),inset 10px 12px 30px rgba(255,255,255,.22),0 0 100px rgba(138,116,255,.55),0 0 200px rgba(138,116,255,.22)}}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(3,1,12,.65);backdrop-filter:blur(6px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#171040,#0d0928);border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{border-radius:22px}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media(min-width:900px){#toast{bottom:24px;left:calc(50% + 110px)}}
#toast div{background:#221a5a;border:1px solid var(--line2);padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:auto;font-weight:600;font-size:14px}
/* wizard */
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)} .steps i.on{background:var(--v1)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl label{margin:0;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);cursor:pointer;font-weight:600}
.tpl label:has(input:checked){border-color:var(--v1);background:var(--glass2)}
details.ch{border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--glass)}
details.ch+details.ch{margin-top:10px}
details.ch summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
details.ch summary::after{content:"+";color:var(--v1)} details.ch[open] summary::after{content:"–"}
details.ch ol,details.ch ul{padding-left:20px}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden} .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--v1))}
:focus-visible{outline:2px solid var(--v1);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- welcome (setup step 0) ---------- */
body.bare{padding:0!important} body.bare #nav,body.bare #side{display:none!important}
.welcome{--pglow:#8a74ff;min-height:100svh;max-width:1120px;margin:0 auto;display:grid;grid-template-rows:auto auto;align-content:center;gap:4px;
  padding:calc(env(safe-area-inset-top) + 12px) 22px calc(env(safe-area-inset-bottom) + 22px)}
.w-art{position:relative;height:min(47svh,430px);min-height:300px}
.w-art::after{content:"";position:absolute;left:4%;bottom:-2%;width:46%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);z-index:1}
.w-planet{position:absolute;right:-2%;top:0;width:min(70vw,340px);aspect-ratio:1;border-radius:50%;background:center/cover no-repeat var(--art);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.9),0 0 70px color-mix(in srgb,var(--pglow) 38%,transparent),0 0 160px color-mix(in srgb,var(--pglow) 14%,transparent)}
.w-planet.none{background:radial-gradient(circle at 35% 30%,#efe9ff,var(--v2) 45%,var(--v4))}
.w-sign{position:absolute;top:1%;right:2%;width:28px;color:var(--pglow);z-index:2;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)) drop-shadow(0 0 10px color-mix(in srgb,var(--pglow) 55%,transparent))}
.w-sign svg{display:block;width:100%;height:auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.w-res{position:absolute;left:6%;bottom:0;height:88%;width:auto;z-index:2;filter:drop-shadow(0 18px 24px rgba(0,0,0,.7))}
.w-copy{position:relative;z-index:3;max-width:34rem}
.w-lock{display:block;width:140px;height:auto;margin:6px 0 10px}
.welcome h1{font-size:clamp(38px,11vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1;margin:0 0 12px;text-wrap:balance}
.w-lead{font-size:18px;line-height:1.5;color:var(--ink);margin:0 0 14px;max-width:32ch;text-wrap:pretty}
.w-meta{font-size:13px;color:var(--dim);margin:0 0 18px}
.welcome label{margin-top:2px}
.welcome input{margin-bottom:14px}
.w-cta{display:flex;flex-direction:column;align-items:stretch;gap:12px}
.btn.big{min-height:54px;font-size:17px;justify-content:center;padding:12px 28px}
.w-skip{align-self:center;color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.w-skip:hover{color:#fff}
@media(min-width:820px){
  .welcome{grid-template-columns:1.1fr 1fr;grid-template-rows:none;align-items:center;gap:40px;padding:40px 48px}
  .w-art{height:min(78svh,640px)}
  .w-planet{width:min(34vw,470px);right:2%;top:8%}
  .w-sign{top:4%;right:0;width:34px}
  .w-res{height:88%;left:4%}
  .welcome h1{font-size:clamp(56px,6vw,84px)}
  .w-lock{width:190px}
  .w-cta{flex-direction:row;align-items:center;gap:20px} .w-skip{align-self:auto}
  .w-lead{font-size:19px}
}
@media(prefers-reduced-motion:no-preference){
  .w-planet{animation:wArrive 1.2s cubic-bezier(.16,1,.3,1) both,wFloat 9s ease-in-out 1.2s infinite}
  .w-res{animation:wFade .7s cubic-bezier(.16,1,.3,1) .35s both}
  .w-sign{animation:wFade .7s cubic-bezier(.16,1,.3,1) .7s both}
  .w-copy>*{animation:wUp .7s cubic-bezier(.16,1,.3,1) both} .w-copy>:nth-child(2){animation-delay:.08s} .w-copy>:nth-child(3){animation-delay:.14s} .w-copy>:nth-child(n+4){animation-delay:.2s}
}
@keyframes wArrive{from{opacity:0;transform:scale(.94);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes wFloat{50%{transform:translateY(-8px)}}
@keyframes wFade{from{opacity:0}to{opacity:1}}
@keyframes wUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* jumpstart + progress */
.js h1{font-size:26px}
.js-steps{list-style:none;counter-reset:js;padding:0;margin:14px 0 0;display:grid;gap:18px}
.js-steps>li{counter-increment:js;position:relative;padding-left:40px;display:grid;gap:8px;justify-items:start}
.js-steps>li::before{content:counter(js);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#140a3a;background:linear-gradient(180deg,#efe9ff,#b9a8ff)}
.js-steps textarea{width:100%;min-height:120px}
.js-steps .seg{margin:0}
.steps-list{margin:8px 0 4px;padding-left:22px} .steps-list li{margin:4px 0}
.nextup .bar{height:6px;border-radius:6px;background:var(--glass2);margin:10px 0 4px;overflow:hidden}
.nextup .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--v2),var(--v1))}
::selection{background:rgba(185,168,255,.35);color:#fff}
body.focus{padding-bottom:env(safe-area-inset-bottom)!important} body.focus #nav{display:none!important}
@media(min-width:900px){body.focus{padding-left:0!important} body.focus #side{display:none!important} body.focus .top{display:flex}}
.card.quick{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-color:var(--line2)}
.card.quick .btn.big{min-height:48px;font-size:16px}
@media(max-width:520px){.card.quick .btn{width:100%;justify-content:center}}
.card.harvest h3 .faint{font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--v1);text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer}
.js h3{margin-top:18px}
.hero .hero-sign{position:absolute;left:27%;top:20%;width:5.5%;min-width:18px;max-width:30px;z-index:3;color:var(--pglow);pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)) drop-shadow(0 0 10px color-mix(in srgb,var(--pglow) 55%,transparent))}
.hero .hero-sign svg{display:block;width:100%;height:auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:no-preference){.hero .hero-sign{animation:wFloat 9s ease-in-out infinite}}
.chip-row{margin:8px 0 4px}
.projects-chip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;border-radius:12px;background:#fafafa;color:#1f1f1f;font:500 16px/1.2 -apple-system,system-ui,sans-serif;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.35)}
.projects-chip svg{width:22px;height:22px;fill:none;stroke:#1f1f1f;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.homeline{margin:14px 0 6px;padding:10px 12px;border-radius:12px;background:var(--glass2);border:1px solid var(--line2);font-size:14px;color:var(--ink)}
.card.whatsnew{border-color:var(--line2);background:linear-gradient(180deg,rgba(185,168,255,.18),rgba(185,168,255,.06))}
.card.sync{border-color:var(--line2)}
.codebox{margin-top:12px}
.codebox textarea,#pair-in{width:100%;min-height:64px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}

/* iOS zooms into any field under 16px and stays zoomed; keep fields at 16px on touch screens */
@media (pointer:coarse){input,select,textarea,.codebox textarea,#pair-in{font-size:16px!important}}

/* Jupiter edition: stations are Jupiter's real moons */
.hero .station i.moon{background:var(--moon) center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 0 4px rgba(255,222,180,.45))}
.hero .station .moonname{font-style:normal;font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:none;color:#E8B57A;opacity:.9}
</style>
</head>

      '- If you can see my files (Cowork with a folder connected, or Claude Code): find my website project. If it is not connected yet, ask me to add the folder. If there is more than one, ask me which. Read it properly: README, package.json or config, the git history (git log), recent changes, and any notes, TODOs or plans in it.\n' +
      '- Also, if you can search my past chats: search them about the website with several keywords (website, site, build, page, design, domain, deploy, launch, and anything specific you find) and read them, not just their titles.\n' +
      'Then write the full build record:\n' +
      '  a. What the site is, who it is for, and the tools it uses (framework, hosting, domain, services).\n' +
      '  b. Every step already done, in order, each with its date if you can find it.\n' +
      '  c. Where it stands right now: what works, what is half done, anything broken.\n' +
      '  d. Every step left, in order, as clear tasks.\n' +
      '  e. Open questions, and anything only I can do (logins, payments, content, decisions).\n' +
      '  f. Links and files that matter.\n' +
      '- If you can write files: save this as BUILD-PROGRESS.md in the website project, and add this standing rule to the project\'s CLAUDE.md (create it if missing): "After every step you finish on this site, update BUILD-PROGRESS.md: move the step to Done with today\'s date, update Right now and Next steps. Then end your reply with a POLARIS block with the steps done and the steps next." Ask me before writing if you need to.\n' +
      '- If you cannot write files: give me the record as a document I can keep.\n' +
      '- If we are in a Project: save the full record to this Project\'s memory too, word for word where it matters, so every new chat in this Project starts knowing exactly where the build stands. From now on, after every step we finish in this Project, update that memory (move the step to done with the date, update what is next) without me asking.\n\n' +
      '## 1b. Keep it current without me (Cowork)\n' +
      'If you can create scheduled tasks, set one up (ask me first): every evening, review that day\'s chats and the website folder, update BUILD-PROGRESS.md, save that day\'s POLARIS block as a file in a polaris folder inside the project (polaris/YYYY-MM-DD.md), and if you can, copy it to my clipboard and notify me, so all I do is open polaris on my phone and tap Save from Claude. Skip days with no changes.\n\n' +
      '## 2. Keep it saved from now on\n' +
      'In every chat with me from now on, whenever a build step is finished, something is decided, or something is left waiting on me, end that reply with a POLARIS block (format below) without being asked. If you can save to memory, remember this rule. In Cowork or Claude Code, also save the "polaris: start here" text at the bottom of this message where your standing instructions live (for example ~/.claude/CLAUDE.md or my Cowork instructions) so every session follows it (ask me first). If neither works, tell me in one line where to paste it.\n\n' +
      '## 3. Give me my POLARIS block\n' +
      'End this reply with one POLARIS block for topic "' + J + '": one group per step done (kind: done), one per step left (kind: next), the main facts (kind: fact), open questions (kind: question), what only I can do (kind: waiting), and key files or links (kind: asset or source). Exact format, groups split by a line with ---:\n\n' +
      '```\nPOLARIS v1\ntopic: ' + J + '\n---\nkind: done\nsaid: MM/DD/YYYY\nwords: my exact words, if I said it\nproposal: one plain sentence\nbase: a link, file or chat name\n---\nEND POLARIS\n```\n\n' +
      '## 4. Then my other chats: the harvest (optional, only when I say next)\n' +
      'After the block, explain in two lines what the harvest is (going back through my older chats so polaris has them too) and ask if I want it. If I say next, go one topic at a time with the same block format, and tell me which topic comes after.\n\n' +
      'Rules: only what was actually said, done or decided. Dates as MM/DD/YYYY. Quote me word for word in words, never reword me. If you made a call without asking me, start the proposal with "assistant call:". Leave a field blank rather than guess. Never put passwords, keys or tokens in the record.\n\n' +
      '---\n' + frontDoor('claude');
  }

          '<h3>From now on, Claude writes the save box</h3><p class="small dim">You never have to ask. Whenever something is decided or finished, Claude ends its reply with a POLARIS box on its own. Copy that reply, open polaris, tap <b>Save from Claude</b>. That\'s it.</p>' +
          '<p class="small faint">Quick check: start a new Claude chat and decide something small. If the reply ends with a POLARIS box, you\'re set. If not, tap <button class="linkish" data-act="copy-front" data-v="claude">Copy start-here</button> and paste it in Claude, Settings, Profile, the personal preferences box.</p>' +

  V.guide = function () {
    var ch = [
      ['What polaris is', '<p>When you work with AI chats, the real decisions scatter: one chat knows the plan, another has the latest version, a third quietly contradicts both. polaris is the one place they all report back to.</p><ul><li><b>Topics</b>: one record per area, with a Start here block, decisions, ideas, open questions, conflicts and sources.</li><li><b>Inbox</b>: chats propose; you apply, hold or reject.</li><li><b>Waiting</b>: what only you can do.</li><li><b>Vault</b>: pointers to your files and where they live.</li><li><b>Log</b>: corrections you made and calls a chat made without asking.</li></ul>'],
      ['Your first day, step by step', '<p>Follow these in order the first time. After that, it is only the save loop.</p><ol>' +
        '<li><b>Install it.</b> iPhone: open the link in Safari, tap Share, then Add to Home Screen, then Add. Android: in Chrome, tap the menu, then Add to Home screen or Install app. From then on, open polaris from its icon, not the browser.</li>' +
        '<li><b>Run setup.</b> Tap <a href="#setup">Set up polaris</a>. Check your name, pick three to six topics, choose On this device, keep the rules, tap Done.</li>' +
        '<li><b>Teach Claude.</b> In <a href="#settings">Settings</a>, tap Copy start-here for Claude. In Claude, open Settings, then Profile, paste it into the personal preferences box and save. Using Claude Projects? Paste it into each Project\'s instructions too.</li>' +
        '<li><b>Test it.</b> Start a new Claude chat and decide something small. The reply should end with a box that starts with POLARIS v1.</li>' +
        '<li><b>Save that reply.</b> Copy the whole reply. Open <a href="#capture">Capture</a>, paste, tap Read it, then Add to Inbox.</li>' +
        '<li><b>Sort it.</b> Open <a href="#inbox">Inbox</a>. Apply what is right, Hold what you are unsure of, Reject what is wrong. Applied items land on their topic page.</li>' +
        '<li><b>Catch up on old chats.</b> Read the Harvest chapter below and do it once, in one sitting or a few.</li>' +
        '<li><b>Back up.</b> In Settings, tap Export backup (.json) and keep the file somewhere safe. Do it once a month.</li></ol>' +
        '<p><b>The save loop, every time:</b> copy the reply, Capture, Read it, Add to Inbox, Apply. No box at the end of a chat? Type <b>polaris handoff</b> in that chat.</p>' +
        '<p><b>Starting a new chat about a topic:</b> open the topic, tap Copy record, and paste it into the new chat first, so it starts knowing everything.</p>' +
        '<p class="dim">Read it found nothing? Make sure you copied the line that says POLARIS v1. The app looks old after an update? Close it fully and open it again.</p>'],
      ['Set it up (5 minutes)', '<ol><li>Open <a href="#setup">Setup</a>. Pick three to six topics.</li><li>Choose where your data lives: this device, or your own GitHub repo.</li><li>Keep the rules you want.</li><li>Copy the start-here text into your Claude Project instructions and your ChatGPT custom instructions (or a ChatGPT Project).</li></ol><p>That is it. Your chats now know your topics, your rules and how to hand things back.</p>'],
      ['The daily loop', '<ol><li>Work in any chat as usual.</li><li>At the end, say <b>polaris handoff</b>, or paste the <a href="#capture">handoff prompt</a>.</li><li>Copy the whole reply and paste it into <a href="#capture">Capture</a>. polaris finds the POLARIS block and shows what it read.</li><li>Add it to the Inbox. Then apply each item: a fact goes to Start here, a decision to Decisions, a waiting item to Waiting, a file to the Vault.</li></ol><p class="dim">Tip: when a new fact replaces an old one, mark the old line superseded. It stays in the record, crossed out, so you can always see what changed and when.</p>'],
      ['Harvest: catching up on past chats', '<p><b>Harvest</b> means going back through the chats you already had and pulling out what matters, so polaris starts full instead of empty. You do it once, after setup. After that, every new chat saves itself as you go.</p><ol><li>Copy the <b>harvest prompt</b> from <a href="#capture">Capture</a> or Settings.</li><li>In Claude, open <b>Projects</b> in the sidebar:<div class="chip-row">' + PROJECTS_CHIP + '</div>Open one Project, start a new chat inside it, paste and send. Claude can only see the chats in the Project you are in, so do this once in each of your Projects, plus once in a new chat outside Projects for the rest. (ChatGPT with chat history on works too.)</li><li>It works one topic at a time and replies with a POLARIS block. Paste each reply into Capture, add it to the Inbox, then say <b>next</b> in the chat.</li><li>Sort the Inbox: apply what is right, reject what is not, hold what you are unsure of. Conflicts land in the topic so you decide which version stands.</li></ol><p class="dim">Big history? Do your most important topic first, then the rest over a few sittings. Once a week, the <b>weekly catch-up</b> prompt does the same for the last 7 days, in case a chat ended without a handoff.</p>'],
      ['How polaris was made', '<p>polaris started as one person\'s fix for a real problem: dozens of AI chats and projects, each holding part of the story, and new chats repeating old plans or quietly overriding decisions. This is how he went about it. You can do the same, at any size.</p><ol><li><b>One pilot first.</b> He picked one topic and did the whole process on it before touching the rest.</li><li><b>Inventory.</b> He listed every chat and project he had, then grouped them into a handful of homes. Fewer, bigger homes beat many small ones.</li><li><b>Harvest in parallel.</b> Several AI helpers read the old chats at once, one topic each. Every fact kept the date it was said and the chat it came from.</li><li><b>He rules, the AI proposes.</b> Where chats disagreed, nothing was picked silently. Conflicts went on a list and he decided each one. By default the newest dated statement wins, and older lines stay in the record, marked superseded.</li><li><b>A Vault for files.</b> Images, documents and versions got a list saying what each is and where it lives.</li><li><b>A fresh check.</b> Before a topic counted as done, a fresh AI that had not seen the work read the record cold and answered questions from it.</li><li><b>One front door.</b> One start-here page every new chat reads first, so no chat starts from zero.</li><li><b>Keep it alive.</b> A running log of every correction he made, so nothing got lost when a chat ran long, and a weekly review.</li></ol><p class="dim">This app packs that whole method into one place, without the setup.</p>'],
      ['The weekly review', '<p>Once a week, open <a href="#review">Weekly review</a> and go down the list: sort the Inbox, clear Waiting, settle conflicts, move topic statuses, approve Vault entries, close Log rows, back up. polaris reminds you on Home when it is due.</p>'],
      ['The rules, and why', '<ul><li><b>Newest dated statement wins.</b> Chats repeat old plans. Dates settle it.</li><li><b>Nothing deleted without your yes.</b> polaris archives instead of deleting. Rejected Inbox items are kept.</li><li><b>Locked means locked.</b> Lock a line and it cannot be edited or archived until you unlock it.</li><li><b>Dates and sources on everything.</b> Every line says when it was said and where.</li><li><b>Pointers are links.</b> Put the link in base, and polaris makes it clickable.</li></ul>'],
      ['Keep your phone and computer in sync (GitHub)', '<p>Optional. Once it is on, every change you make on one device shows up on the other by itself: polaris syncs when you open it and a few seconds after every change. About 10 minutes, once. If you have Claude Cowork, paste this whole chapter into it and say <b>do this for me</b>: it can do every step except signing in and tapping Generate.</p><ol>' +
        '<li><b>Make a free GitHub account</b> at <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a> (skip if you have one). Note your username.</li>' +
        '<li><b>Make a private home for your polaris.</b> Open <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a>. Repository name: <code>my-polaris</code>. Choose <b>Private</b>. Tick <b>Add a README file</b>. Tap <b>Create repository</b>.</li>' +
        '<li><b>Make a key just for it.</b> Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>. Token name: <code>polaris</code>. Expiration: <b>1 year</b>. Repository access: <b>Only select repositories</b>, then pick <code>my-polaris</code>. Under Permissions, Repository permissions, set <b>Contents</b> to <b>Read and write</b>. Leave everything else alone. Tap <b>Generate token</b> and copy it (it starts with <code>github_pat_</code>). GitHub shows it only once.</li>' +
        '<li><b>Connect this device.</b> In polaris, open <a href="#settings">Settings</a>, Your data, tap <b>GitHub sync</b>. Owner: your GitHub username. Repo: <code>my-polaris</code>. Leave Branch <code>main</code> and File <code>polaris.json</code>. Paste the token. Tap <b>Save and sync now</b>. You should see <b>Synced</b>.</li>' +
        '<li><b>Connect your other device.</b> Open your polaris link there, Settings, GitHub sync, same owner and repo, paste the same token, <b>Save and sync now</b>. Everything from the first device comes over and merges.</li></ol>' +
        '<p><b>From then on</b> you do nothing: open polaris on either device and it is up to date. If both devices changed the same line, the newer one wins and the other lands in your Inbox as held, so nothing is lost.</p>' +
